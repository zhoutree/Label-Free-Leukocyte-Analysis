[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "label-free-leukocyte-analysis"
version = "0.1.0"
description = "Label-free brightfield leukocyte classification experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pillow",
    "tifffile",
    "lightning",
    "rich",
    "torchmetrics",
    "tensorboard",
    "scikit-learn",
    "matplotlib",
    "scipy",
]

[project.scripts]
leukocyte-prepare-data = "leukocyte_analysis.prepare_data:main"
leukocyte-train = "leukocyte_analysis.train:main"
leukocyte-evaluate = "leukocyte_analysis.evaluate:main"
leukocyte-record-errors = "leukocyte_analysis.record_errors:main"
leukocyte-cross-validate = "leukocyte_analysis.cross_validate:main"
leukocyte-resume-cv = "leukocyte_analysis.resume_cv:main"
leukocyte-brightness-stress = "leukocyte_analysis.brightness_stress:main"
leukocyte-audit-brightness = "leukocyte_analysis.audit_brightness:main"

[tool.setuptools.packages.find]
where = ["src"]
