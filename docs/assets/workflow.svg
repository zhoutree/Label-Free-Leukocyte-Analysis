<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">BBBC045 白细胞分类项目流程</title>
  <desc id="desc">明场原图生成图块与清单，按受试者隔离后，分别进行三折折外评估和常规模型的原保留测试集评估。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#4474a7"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="918" height="458" rx="18" fill="#ffffff" stroke="#dce5ee" stroke-width="2"/>
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#193047">
    <text x="34" y="43" font-size="24" font-weight="700">项目流程</text>
    <text x="34" y="68" font-size="14" fill="#60758a">数据准备 → 受试者隔离 → 两条独立评估路径</text>

    <rect x="34" y="91" width="238" height="78" rx="12" fill="#f1f7fc" stroke="#9fc0dc" stroke-width="2"/>
    <text x="153" y="122" text-anchor="middle" font-size="18" font-weight="700">BBBC045 原图</text>
    <text x="153" y="148" text-anchor="middle" font-size="14" fill="#526c82">ch5 明场 TIFF</text>

    <rect x="340" y="91" width="238" height="78" rx="12" fill="#f1f7fc" stroke="#9fc0dc" stroke-width="2"/>
    <text x="459" y="122" text-anchor="middle" font-size="18" font-weight="700">裁切与打包</text>
    <text x="459" y="148" text-anchor="middle" font-size="14" fill="#526c82">55×55 图块 + 来源清单</text>

    <rect x="646" y="91" width="238" height="78" rx="12" fill="#f1f7fc" stroke="#9fc0dc" stroke-width="2"/>
    <text x="765" y="122" text-anchor="middle" font-size="18" font-weight="700">受试者分组</text>
    <text x="765" y="148" text-anchor="middle" font-size="14" fill="#526c82">训练侧计算归一化统计量</text>

    <path d="M277 130 H332 M583 130 H638" fill="none" stroke="#4474a7" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M765 171 V200 H239 V220 M765 200 H681 V220" fill="none" stroke="#4474a7" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="42" y="227" width="394" height="100" rx="14" fill="#eef8f7" stroke="#84c7bd" stroke-width="2"/>
    <text x="239" y="259" text-anchor="middle" font-size="18" font-weight="700">三折受试者分组交叉验证</text>
    <text x="239" y="287" text-anchor="middle" font-size="14" fill="#486e69">每折仅在训练图块拟合统计量与权重</text>
    <text x="239" y="309" text-anchor="middle" font-size="14" fill="#486e69">原保留测试受试者不参与</text>

    <rect x="484" y="227" width="394" height="100" rx="14" fill="#fff6ec" stroke="#efbb80" stroke-width="2"/>
    <text x="681" y="259" text-anchor="middle" font-size="18" font-weight="700">常规训练与选最佳权重</text>
    <text x="681" y="287" text-anchor="middle" font-size="14" fill="#806347">train / val → best.ckpt</text>
    <text x="681" y="309" text-anchor="middle" font-size="14" fill="#806347">再评估 CRF049、CRF066</text>

    <path d="M239 331 V350 M681 331 V350" fill="none" stroke="#4474a7" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="42" y="357" width="394" height="68" rx="12" fill="#dff2ef"/>
    <text x="239" y="386" text-anchor="middle" font-size="17" font-weight="700">折外 84,815 图块</text>
    <text x="239" y="411" text-anchor="middle" font-size="16">Accuracy 99.39% · Macro-F1 0.9816</text>

    <rect x="484" y="357" width="394" height="68" rx="12" fill="#fff0dc"/>
    <text x="681" y="386" text-anchor="middle" font-size="17" font-weight="700">原保留测试 15,290 图块</text>
    <text x="681" y="411" text-anchor="middle" font-size="16">Accuracy 99.05% · Macro-F1 0.9711</text>
  </g>
</svg>
