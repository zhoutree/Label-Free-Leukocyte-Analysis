name: label-free-leukocyte
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14
  - pip
  - pip:
      - --index-url https://pypi.org/simple
      - --extra-index-url https://download.pytorch.org/whl/cu132
      # 仅固定 PyTorch 的 CUDA 构建配对，避免解析到 CPU 包或不匹配的 torchvision。
      - torch==2.14.1+cu132
      - torchvision==0.29.1+cu132
      - numpy
      - pillow
      - tifffile
      - lightning
      - rich
      - torchmetrics
      - tensorboard
      - scikit-learn
      - matplotlib
      - scipy
      # 特征空间拒识使用；原训练及 CSV 复核不依赖此可选功能。
      - pytorch-ood==0.4.0
      # 患者级 PDF 汇总与细胞图册；不改变训练依赖。
      - reportlab
